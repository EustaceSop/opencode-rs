[package]
name = "opencode-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opencode-core = { path = "../opencode-core" }
opencode-storage = { path = "../opencode-storage" }
indexmap = { version = "2.14.2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
similar = "3.2.1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "io-util", "time", "sync", "fs"] }
url = "2.5.8"
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-std", "net"] }
