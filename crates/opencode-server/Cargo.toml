[package]
name = "opencode-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
base64 = "0.23.1"
flate2 = "1.1.11"
futures-util = "0.3.34"
ignore = "0.4.34"
mime_guess = "2.0.5"
opencode-core = { path = "../opencode-core" }
opencode-llm = { path = "../opencode-llm" }
opencode-mcp = { path = "../opencode-mcp" }
opencode-session = { path = "../opencode-session" }
opencode-storage = { path = "../opencode-storage" }
opencode-tools = { path = "../opencode-tools" }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "process", "io-util", "rt"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }
tokio-tungstenite = "0.30.0"
