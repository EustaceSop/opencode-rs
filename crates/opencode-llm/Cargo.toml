[package]
name = "opencode-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
crc32fast = "1.5.5"
futures-util = "0.3.34"
getrandom = "0.3.4"
httpdate = "1.0.3"
opencode-core = { path = "../opencode-core" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "net", "io-util", "process"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
