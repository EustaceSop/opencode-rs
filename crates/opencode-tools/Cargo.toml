[package]
name = "opencode-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
dunce = "1.0.5"
htmd = "0.5.6"
html-escape = "0.3.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
similar = "3.2.1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "io-util", "time", "sync", "fs"] }
tokio-util = "0.7.20"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-powershell = "0.26.6"
which = "8.0.6"
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
