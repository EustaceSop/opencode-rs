[package]
name = "opencode-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opencode-core = { path = "../opencode-core" }
opencode-tools = { path = "../opencode-tools" }
async-trait = "0.1.92"
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = { version = "0.11.1", default-features = false }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "io-util", "time", "sync", "fs", "net"] }
tokio-util = "0.7.20"
which = "8.0.6"

[dev-dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }
