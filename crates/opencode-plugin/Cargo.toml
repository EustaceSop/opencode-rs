[package]
name = "opencode-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
opencode-core = { path = "../opencode-core" }
opencode-tools = { path = "../opencode-tools" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "io-util", "time", "sync"] }
tokio-util = "0.7.20"
url = "2.5.8"
which = "8.0.6"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
