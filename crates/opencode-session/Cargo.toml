[package]
name = "opencode-session"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
futures-util = "0.3.34"
indexmap = "2.14.2"
opencode-core = { path = "../opencode-core" }
opencode-llm = { path = "../opencode-llm" }
opencode-lsp = { path = "../opencode-lsp" }
opencode-mcp = { path = "../opencode-mcp" }
opencode-plugin = { path = "../opencode-plugin" }
opencode-storage = { path = "../opencode-storage" }
opencode-tools = { path = "../opencode-tools" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
tokio-util = "0.7.20"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["net", "io-util", "rt-multi-thread", "macros"] }
